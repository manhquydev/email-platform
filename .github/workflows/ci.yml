name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["*"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: email_service
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - "6380:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            services/api/package-lock.json
            services/web/package-lock.json

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            nc -z localhost 5432 && echo "Postgres is up" && break
            sleep 2
          done

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -tc "SELECT 1 FROM pg_database WHERE datname='email_service_test'" | grep -q 1 || \
            psql -h localhost -U postgres -c "CREATE DATABASE email_service_test;"

      - name: Install API deps
        working-directory: services/api
        run: npm install

      - name: Generate Prisma client
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/email_service_test
        run: npm run prisma:generate

      - name: Migrate database
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/email_service_test
        run: npm run prisma:deploy

      - name: Lint API
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/email_service_test
        run: npm run lint

      - name: Test API
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/email_service_test
          STRIPE_API_KEY: sk_test_dummy_key_for_testing_only
          STRIPE_WEBHOOK_SECRET: whsec_test_dummy_secret
          STORAGE_DIR: ./storage_test
          REDIS_HOST: localhost
          REDIS_PORT: "6380"
          # Outbound SMTP config (dummy for CI - tests will skip if not real)
          OUTBOUND_SMTP_HOST: localhost
          OUTBOUND_SMTP_PORT: "587"
          OUTBOUND_SMTP_USER: test
          OUTBOUND_SMTP_PASS: test
          # Skip integration tests requiring external services
          CI: "true"
        run: npm test -- --exclude="**/dkim_signing.integration.test.ts" --exclude="**/webhook-e2e.test.ts" --exclude="**/security.integration.test.ts" --exclude="**/subscription.integration.test.ts"

      - name: Build API
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/email_service_test
        run: npm run build

      - name: Install Web deps
        working-directory: services/web
        run: npm install

      - name: Lint Web
        working-directory: services/web
        run: npm run lint

      - name: Test Web
        working-directory: services/web
        run: npm test

      - name: Build Web
        working-directory: services/web
        run: npm run build
