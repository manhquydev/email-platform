# Docker Compose Production - Email Platform
# ==========================================
# Sử dụng: DOMAIN=yourdomain.com ACME_EMAIL=admin@yourdomain.com docker-compose -f docker-compose.prod.yml up -d
#
# Biến môi trường cần thiết:
# - DOMAIN: Domain cho HTTPS (vd: example.com)
# - ACME_EMAIL: Email nhận thông báo Let's Encrypt
# - POSTGRES_PASSWORD: Mật khẩu PostgreSQL (production)
# - JWT_SECRET: Secret cho JWT (nên dùng từ generate_env.sh)

services:
  # ===================
  # REVERSE PROXY - SSL
  # ===================
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@localhost}
    depends_on:
      - api
      - web
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===================
  # DATABASE
  # ===================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: email_service
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups # Thư mục backup
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Không expose port ra ngoài trong production

    # ===================
    # REDIS (Queue/Cache)
    # ===================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Không expose port ra ngoài trong production

    # ===================
    # API BACKEND
    # ===================
  api:
    build:
      context: ./services/api
    restart: unless-stopped
    env_file:
      - ./services/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/email_service
      HTTP_PORT: 3001
      SMTP_PORT: 2525
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Self-hosted Postfix SMTP (local container)
      OUTBOUND_SMTP_HOST: postfix
      OUTBOUND_SMTP_PORT: 25
      OUTBOUND_SMTP_USER: ""
      OUTBOUND_SMTP_PASS: ""
      OUTBOUND_SMTP_SECURE: "false"
      OUTBOUND_ENABLED: "true"
      # Mail configuration
      MAIL_DOMAIN: ${DOMAIN:-localhost}
      MAIL_FROM_NAME: "Ephemera"
      MAIL_FROM_ADDRESS: "noreply@${DOMAIN:-localhost}"
      # TEMPORARY: Set to false until PTR record is configured
      # Change to true after setting up PTR record with DigitalOcean
      REQUIRE_EMAIL_VERIFICATION: "false"
      ALLOW_AUTO_DOMAIN_CREATION: "false" # Disabled in production
      WEB_URL: https://app.${DOMAIN:-localhost}
      STORAGE_DIR: /app/storage
      TRUST_PROXY: "true"
      # Postfix sync configuration
      RELAY_DOMAINS_PATH: /app/shared/relay_domains
      POSTFIX_CONTAINER: email-platform-postfix-1
    depends_on:
      - postgres
      - redis
      - postfix
    volumes:
      - api_storage:/app/storage
      - postfix_shared:/app/shared
    ports:
      - "2525:2525" # SMTP Inbound (không qua Caddy)
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===================
  # OUTBOUND SMTP (Postfix + OpenDKIM)
  # ===================
  postfix:
    build:
      context: ./services/postfix
    restart: unless-stopped
    hostname: mail.${DOMAIN:-localhost}
    environment:
      MAIL_DOMAIN: ${DOMAIN:-localhost}
      MAIL_HOSTNAME: mail.${DOMAIN:-localhost}
      DKIM_SELECTOR: mail
      RELAY_HOST: ${RELAY_HOST}
      RELAY_PORT: ${RELAY_PORT:-2525}
      RELAY_USER: ${RELAY_USER}
      RELAY_PASS: ${RELAY_PASS}
      EXTRA_DOMAINS: manhquy.online
    volumes:
      - postfix_dkim:/etc/opendkim/keys
      - postfix_shared:/app/shared
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Port 25 có thể expose nếu cần nhận mail từ ngoài
    ports:
      - "25:25"
      - "587:587"
    # ===================
    # IMAP SERVER (Dovecot)
    # ===================
  dovecot:
    build:
      context: ./services/dovecot
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - maildir_data:/var/mail
      - ./services/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./services/dovecot/dovecot-sql.conf.ext:/etc/dovecot/dovecot-sql.conf.ext:ro
      - ./services/dovecot/conf.d:/etc/dovecot/conf.d:ro
    ports:
      - "143:143" # IMAP
      - "993:993" # IMAPS
    depends_on:
      - postgres
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "doveadm", "service", "status" ]
      interval: 30s
      timeout: 10s
      retries: 3
    # ===================
    # WEB FRONTEND
    # ===================
  web:
    build:
      context: ./services/web
      args:
        VITE_API_BASE: https://api.${DOMAIN:-localhost}
        VITE_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
        VITE_MAIL_HOSTNAME: mail.${DOMAIN:-localhost}
        VITE_MAIL_SERVER_IP: ${MAIL_SERVER_IP:-165.22.48.193}
        VITE_CLARITY_PROJECT_ID: ${VITE_CLARITY_PROJECT_ID:-}
    restart: unless-stopped
    environment:
      # Runtime environment for entrypoint.sh to generate config.js
      VITE_API_BASE: https://api.${DOMAIN:-localhost}
      OUTBOUND_ENABLED: ${OUTBOUND_ENABLED:-false}
      VITE_MAIL_HOSTNAME: mail.${DOMAIN:-localhost}
      VITE_MAIL_SERVER_IP: ${MAIL_SERVER_IP:-165.22.48.193}
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Port 80 nội bộ, Caddy reverse proxy

    # ===================
    # MONITORING
    # ===================
  prometheus:
    image: prom/prometheus:v2.45.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./services/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.0.3
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN:-localhost}
    volumes:
      - ./services/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # ===================
  # ANTI-ABUSE
  # ===================
  # ClamAV virus scanning
  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
        reservations:
          cpus: '0.50'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "clamdscan", "--version" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Rspamd spam filtering
  rspamd:
    image: rspamd/rspamd:latest
    restart: unless-stopped
    volumes:
      - rspamd_data:/var/lib/rspamd
      - ./services/rspamd/local.d:/etc/rspamd/local.d:ro
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "rspamadm", "control", "stat" ]
      interval: 30s
      timeout: 10s
      retries: 3
  # ===================
  # VOLUMES
  # ===================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_storage:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  postfix_dkim:
    driver: local
  postfix_shared:
    driver: local
  clamav_data:
    driver: local
  rspamd_data:
    driver: local
  maildir_data:
    driver: local
  # ===================
  # NETWORKS
  # ===================
networks:
  email_network:
    driver: bridge
