<?xml version="1.0" encoding="UTF-8"?>
<!-- CONCEPT 1: "Dissolving E" - Chữ E đang tan biến thành pixels -->
<!-- Thể hiện: email tạm thời sẽ biến mất, privacy qua sự tan rã -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="c1-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
  </defs>
  
  <!-- Main "E" body - solid left portion -->
  <path d="
    M 20 20
    L 20 100
    L 36 100
    L 36 64
    L 36 56
    L 36 36
    L 36 20
    Z
  " fill="url(#c1-gradient)"/>
  
  <!-- Top bar of E - starts solid, becomes pixels -->
  <rect x="36" y="20" width="20" height="16" fill="url(#c1-gradient)"/>
  <rect x="56" y="20" width="12" height="16" fill="url(#c1-gradient)" opacity="0.9"/>
  <rect x="70" y="20" width="8" height="8" fill="#3B82F6" opacity="0.7"/>
  <rect x="70" y="28" width="6" height="6" fill="#3B82F6" opacity="0.5"/>
  <rect x="80" y="20" width="5" height="5" fill="#60A5FA" opacity="0.4"/>
  <rect x="78" y="30" width="4" height="4" fill="#60A5FA" opacity="0.3"/>
  <rect x="86" y="22" width="3" height="3" fill="#93C5FD" opacity="0.25"/>
  <rect x="84" y="28" width="2" height="2" fill="#93C5FD" opacity="0.2"/>
  <rect x="90" y="24" width="2" height="2" fill="#BFDBFE" opacity="0.15"/>
  
  <!-- Middle bar of E - dissolving stronger -->
  <rect x="36" y="52" width="16" height="16" fill="url(#c1-gradient)"/>
  <rect x="52" y="52" width="10" height="14" fill="url(#c1-gradient)" opacity="0.85"/>
  <rect x="64" y="54" width="7" height="7" fill="#3B82F6" opacity="0.6"/>
  <rect x="64" y="62" width="5" height="5" fill="#3B82F6" opacity="0.4"/>
  <rect x="73" y="52" width="4" height="4" fill="#60A5FA" opacity="0.35"/>
  <rect x="72" y="58" width="3" height="3" fill="#60A5FA" opacity="0.25"/>
  <rect x="78" y="54" width="2" height="2" fill="#93C5FD" opacity="0.2"/>
  <rect x="76" y="62" width="2" height="2" fill="#93C5FD" opacity="0.15"/>
  
  <!-- Bottom bar of E - dissolving most -->
  <rect x="36" y="84" width="18" height="16" fill="url(#c1-gradient)"/>
  <rect x="54" y="84" width="10" height="14" fill="url(#c1-gradient)" opacity="0.8"/>
  <rect x="66" y="86" width="6" height="6" fill="#3B82F6" opacity="0.55"/>
  <rect x="66" y="94" width="5" height="5" fill="#3B82F6" opacity="0.35"/>
  <rect x="74" y="84" width="4" height="4" fill="#60A5FA" opacity="0.3"/>
  <rect x="73" y="90" width="3" height="3" fill="#60A5FA" opacity="0.2"/>
  <rect x="80" y="86" width="2" height="2" fill="#93C5FD" opacity="0.15"/>
  <rect x="78" y="94" width="2" height="2" fill="#BFDBFE" opacity="0.1"/>
  <rect x="84" y="88" width="1.5" height="1.5" fill="#BFDBFE" opacity="0.08"/>
  
  <!-- Floating dissolve particles -->
  <circle cx="92" cy="50" r="1.5" fill="#3B82F6" opacity="0.2"/>
  <circle cx="96" cy="70" r="1" fill="#60A5FA" opacity="0.15"/>
  <circle cx="88" cy="80" r="1.2" fill="#93C5FD" opacity="0.12"/>
  <circle cx="94" cy="40" r="0.8" fill="#BFDBFE" opacity="0.1"/>
</svg>
