# Kustomization for Kubernetes deployment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: tempmail-platform

namespace: tempmail

resources:
  - config-secrets.yaml
  - storage.yaml
  - database-deployment.yaml
  - api-deployment.yaml
  - web-deployment.yaml
  - ingress-hpa.yaml

commonLabels:
  app: tempmail
  environment: production

images:
  - name: tempmail-api
    newName: your-registry/tempmail-api
    newTag: latest
  - name: tempmail-web
    newName: your-registry/tempmail-web
    newTag: latest

# Namespace creation
# kubectl create namespace tempmail --dry-run=client -o yaml | kubectl apply -f -
