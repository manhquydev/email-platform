# Default values for TempMail Pro Helm Chart

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  postgresql:
    auth:
      postgresPassword: ""
      username: tempmail_admin
      database: tempmail_pro
  redis:
    auth:
      enabled: true
      password: ""

# Common labels
commonLabels: {}

# Common annotations
commonAnnotations: {}

# TempMail Pro API configuration
api:
  enabled: true
  replicaCount: 5

  image:
    registry: docker.io
    repository: tempmail-pro/api
    pullPolicy: IfNotPresent
    tag: "latest"

  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    create: true
    annotations: {}
    name: ""

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
    sidecar.istio.io/inject: "true"

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
    runAsNonRoot: true
    runAsUser: 1000

  service:
    type: ClusterIP
    port: 3000
    annotations: {}

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/rate-limit: "100"
      nginx.ingress.kubernetes.io/rate-limit-window: "1m"
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/cors-allow-origin: "*"
      nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
      nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    hosts:
      - host: api.tempmail.pro
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: api-tempmail-pro-tls
        hosts:
          - api.tempmail.pro

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 50
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations:
    - key: "tempmail-pro/workload"
      operator: "Equal"
      value: "api"
      effect: "NoSchedule"

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - tempmail-pro
          topologyKey: kubernetes.io/hostname

  # Environment variables
  env:
    - name: NODE_ENV
      value: "production"
    - name: LOG_LEVEL
      value: "info"
    - name: MAX_REQUEST_SIZE
      value: "10485760"

  # Existing secrets
  existingSecret: ""
  secretKeys:
    databaseUrl: "database-url"
    jwtSecret: "jwt-secret"
    stripeSecret: "stripe-secret"
    webhookSecret: "webhook-secret"

  # ConfigMaps
  configMaps:
    - name: tempmail-config
      data:
        redis-url: "redis://tempmail-pro-redis:6379"
        smtp-host: "smtp.mailgun.org"
        smtp-port: "587"
        email-from: "noreply@tempmail.pro"
        aws-region: "us-east-1"
        s3-bucket: "tempmail-pro-assets"

  # Persistence
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    annotations: {}

  # Liveness and readiness probes
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # Pod disruption budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 3

  # HPA configuration
  hpa:
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
        - type: Percent
          value: 10
          periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 10
          periodSeconds: 15
        selectPolicy: Max

# TempMail Pro Web application
web:
  enabled: true
  replicaCount: 3

  image:
    registry: docker.io
    repository: tempmail-pro/web
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/rate-limit: "200"
      nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    hosts:
      - host: tempmail.pro
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: tempmail-pro-tls
        hosts:
          - tempmail.pro

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

  env:
    - name: REACT_APP_API_URL
      value: "https://api.tempmail.pro"
    - name: REACT_APP_WS_URL
      value: "wss://api.tempmail.pro"

# PostgreSQL configuration
postgresql:
  enabled: true

  auth:
    postgresPassword: ""
    username: tempmail_admin
    database: tempmail_pro
    existingSecret: ""

  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: ""

    resources:
      limits:
        cpu: 1000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi

    initdb:
      scripts:
        00-init.sql: |
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS "pg_trgm";
          CREATE EXTENSION IF NOT EXISTS "btree_gin";

  readReplicas:
    replicaCount: 2
    persistence:
      enabled: true
      size: 100Gi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Redis configuration
redis:
  enabled: true

  auth:
    enabled: true
    existingSecret: ""
    existingSecretPasswordKey: ""

  master:
    persistence:
      enabled: true
      size: 20Gi

    resources:
      limits:
        cpu: 500m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 1Gi

  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 20Gi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Ingress NGINX configuration
ingress-nginx:
  enabled: true

  controller:
    replicaCount: 2
    config:
      rate-limit: "200"
      client-max-body-size: "10m"
      proxy-body-size: "10m"

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80

    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

# Cert-Manager configuration
cert-manager:
  enabled: true

  installCRDs: true

  prometheus:
    enabled: true
    servicemonitor:
      enabled: true

# Prometheus configuration
prometheus:
  enabled: true

  server:
    retention: "15d"

    persistentVolume:
      enabled: true
      size: 50Gi

    resources:
      limits:
        cpu: 1000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 2Gi

  alertmanager:
    enabled: true
    persistentVolume:
      enabled: true
      size: 10Gi

# Grafana configuration
grafana:
  enabled: true

  adminUser: admin
  adminPassword: ""

  persistence:
    enabled: true
    size: 20Gi

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://tempmail-pro-prometheus-server
          access: proxy
          isDefault: true

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      tempmail-api:
        gnetId: 10916
        revision: 1
        datasource: Prometheus
      tempmail-infrastructure:
        gnetId: 315
        revision: 2
        datasource: Prometheus

# Istio configuration (optional)
istio:
  enabled: false

  injection:
    enabled: true

  gateway:
    enabled: true
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

  virtualService:
    enabled: true

# Service Monitor configuration
serviceMonitor:
  enabled: true
  namespace: ""
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s

# Pod Monitor configuration
podMonitor:
  enabled: true
  namespace: ""
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s

# Network policies
networkPolicy:
  enabled: true
  ingress:
    enabled: true
    namespaces: []
  egress:
    enabled: true
    namespaces: []

# Pod Security Policy
podSecurityPolicy:
  enabled: false

# Extra manifests
extraManifests: []
# - |
#   apiVersion: v1
#   kind: ConfigMap
#   metadata:
#     name: extra-config
#   data:
#     key: value