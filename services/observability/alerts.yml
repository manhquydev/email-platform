groups:
  - name: api_health
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m]))
          / sum(rate(http_request_duration_seconds_count[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API error rate > 5%"
          description: "Error rate is {{ $value | humanizePercentage }}"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency > 2 seconds"
          description: "P95 latency is {{ $value }}s"

      - alert: APIDown
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API server is down"
          description: "API service has been down for more than 1 minute"

  - name: email_operations
    rules:
      - alert: EmailQueuePileup
        expr: queue_jobs_current{queue="email", state="waiting"} > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Email queue has > 1000 waiting jobs"
          description: "Queue depth is {{ $value }}"

      - alert: HighEmailFailureRate
        expr: |
          rate(emails_sent_total{status="failed"}[5m])
          / rate(emails_sent_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Email send failure rate > 10%"
          description: "Failure rate is {{ $value | humanizePercentage }}"

  - name: resources
    rules:
      - alert: HighMemoryUsage
        expr: nodejs_heap_size_used_bytes / nodejs_heap_size_total_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node.js heap usage > 90%"
          description: "Heap usage is {{ $value | humanizePercentage }}"

      - alert: HighEventLoopLag
        expr: nodejs_eventloop_lag_seconds > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Event loop lag > 100ms"
          description: "Event loop lag is {{ $value }}s"

  - name: infrastructure
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter is down"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis exporter is down"

  - name: backup_alerts
    interval: 5m
    rules:
      # Backup job failed
      - alert: BackupJobFailed
        expr: backup_success == 0
        for: 5m
        labels:
          severity: critical
          service: backup
        annotations:
          summary: "Backup job failed for {{ $labels.service }}"
          description: "Backup for {{ $labels.service }} has failed for 5 minutes"

      # Backup too old
      - alert: BackupAgeTooOld
        expr: (time() - backup_timestamp) / 3600 > 26
        for: 1m
        labels:
          severity: warning
          service: backup
        annotations:
          summary: "Backup too old for {{ $labels.service }}"
          description: "Last successful backup was {{ $value }} hours ago"

      # Backup size anomaly
      - alert: BackupSizeAnomaly
        expr: |
          abs(
            (backup_size_bytes - avg_over_time(backup_size_bytes[7d]))
            / avg_over_time(backup_size_bytes[7d])
          ) > 0.5
        for: 1m
        labels:
          severity: warning
          service: backup
        annotations:
          summary: "Backup size anomaly for {{ $labels.service }}"
          description: "Backup size differs by >50% from 7-day average"
