server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip support
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. HTML: Never cache (No-Store)
    # Browsers must always check with server for the latest file
    location ~ \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 2. JS/CSS: Cache forever (files have hash in name)
    location ~ \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 3. Static Assets (Images, Fonts)
    location ~ \.(ico|jpg|jpeg|png|gif|eot|otf|webp|ttf|woff|woff2|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 4. JSON (version.json): Network First
    location ~ \.json$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
