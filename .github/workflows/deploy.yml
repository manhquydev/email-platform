name: Deploy to Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          SCAN_OK=0
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.err; then
              SCAN_OK=1
              echo "ssh-keyscan succeeded on attempt $i"
              break
            fi
            echo "ssh-keyscan attempt $i failed"
            cat /tmp/ssh-keyscan.err || true
            sleep 3
          done

          if [ "$SCAN_OK" -ne 1 ]; then
            echo "ssh-keyscan failed after retries. Continue with StrictHostKeyChecking=no fallback."
          fi

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 $SERVER_USER@$SERVER_HOST << 'ENDSSH'
            set -e
            echo "Starting deployment..."

            # Navigate to project directory
            cd ${DEPLOY_PATH:-/root/email-platform.}

            # Pull latest code
            echo "Pulling latest code..."
            git reset --hard
            git pull origin main

            # CRITICAL: Remove orphaned migration folders that cause Prisma P3015 errors
            echo "Cleaning orphaned migration folders..."
            rm -rf services/api/prisma/migrations/manual 2>/dev/null || true
            find services/api/prisma/migrations -type d -empty -delete 2>/dev/null || true

            # Rebuild and restart Docker containers (api, web, postfix, dovecot)
            echo "Rebuilding Docker containers..."
            docker compose -f docker-compose.prod.yml build api web postfix dovecot
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Run database migrations
            echo "Running database migrations..."
            docker exec email-platform-api-1 npx prisma migrate deploy || echo "Migration warning: check logs"

            # Wait for services to be healthy
            echo "Waiting for services to start..."
            sleep 20

            # Trigger Postfix relay domains sync from API
            echo "Syncing Postfix relay domains..."
            docker exec email-platform-api-1 node -e "
              const { PrismaClient } = require('@prisma/client');
              const fs = require('fs');
              const prisma = new PrismaClient();
              async function sync() {
                const domains = await prisma.domain.findMany({ where: { status: 'VERIFIED' }, select: { name: true } });
                if (domains.length === 0) { console.log('No verified domains to sync'); return; }
                const content = domains.map(d => d.name + ' OK').join('\n') + '\n';
                fs.mkdirSync('/app/shared', { recursive: true });
                fs.writeFileSync('/app/shared/relay_domains', content);
                console.log('Synced ' + domains.length + ' domains to Postfix');
                await prisma.\$disconnect();
              }
              sync();
            " || echo "Sync warning: will retry on next API restart"

            # Check container status
            echo "Container status:"
            docker compose -f docker-compose.prod.yml ps

            # Quick health check
            echo "Health check..."
            curl -sf http://localhost:3001/health || echo "API health check pending..."

            echo "Deployment completed successfully!"
          ENDSSH

      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 $SERVER_USER@$SERVER_HOST "docker compose -f /root/email-platform./docker-compose.prod.yml ps"
