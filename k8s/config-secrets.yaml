---
# ============================================================
# SECRETS MANAGEMENT — MIGRATION GUIDE
# ============================================================
# This file MUST NOT contain real secret values in any branch.
# All base64 strings below are PLACEHOLDER values only.
#
# Choose ONE of these two approaches before production deploy:
#
# OPTION A — Sealed Secrets (Bitnami)
#   1. Install: kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/latest/download/controller.yaml
#   2. Install CLI: brew install kubeseal  (or download binary)
#   3. Seal this file:
#        kubeseal --format yaml < config-secrets.yaml > config-secrets-sealed.yaml
#   4. Commit config-secrets-sealed.yaml (safe to store in git).
#      Delete config-secrets.yaml from git history.
#   5. Apply: kubectl apply -f config-secrets-sealed.yaml
#
# OPTION B — External Secrets Operator (ESO)
#   1. Install ESO: helm install external-secrets external-secrets/external-secrets
#   2. Create a SecretStore pointing to your vault (AWS SSM, Vault, GCP SM, etc.)
#   3. Replace this file with an ExternalSecret manifest that references
#      your vault paths — no secret values ever live in this file.
#   4. ESO syncs values automatically; rotate at the vault, not in k8s.
#
# Reference: https://external-secrets.io  |  https://sealed-secrets.netlify.app
# ============================================================

# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempmail-config
  labels:
    app: tempmail
data:
  api-url: "https://api.example.com"
  web-url: "https://app.example.com"
  mail-domain: "example.com"
---
# Secrets — ALL values below are placeholders.
# Replace with real values ONLY via Sealed Secrets or External Secrets Operator
# (see migration guide at the top of this file).
# Generate base64: echo -n 'yourvalue' | base64
apiVersion: v1
kind: Secret
metadata:
  name: tempmail-secrets
  labels:
    app: tempmail
type: Opaque
data:
  # PLACEHOLDER — replace with base64 of your real DATABASE_URL
  database-url: Q0hBTkdFX01FX0JBU0U2NF9EQVRBQkFTRV9VUkw=
  # PLACEHOLDER — replace with base64 of your real read-replica DATABASE_URL
  database-read-url: Q0hBTkdFX01FX0JBU0U2NF9EQVRBQkFTRV9SRUFEX1VSTD0=
  # PLACEHOLDER — generate with: openssl rand -hex 32 | base64
  jwt-secret: Q0hBTkdFX01FX0JBU0U2NF9KV1RfU0VDUkVU
  # PLACEHOLDER — generate with: openssl rand -base64 32 | base64
  postgres-password: Q0hBTkdFX01FX0JBU0U2NF9QT1NUR1JFU19QQVNTV09SRA==
  # PLACEHOLDER — set when Stripe is configured
  stripe-secret-key: ""
  # PLACEHOLDER — set when Stripe webhooks are configured
  stripe-webhook-secret: ""
