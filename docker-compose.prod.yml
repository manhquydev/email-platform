# Docker Compose Production - Email Platform
# ==========================================
# Sử dụng: DOMAIN=yourdomain.com ACME_EMAIL=admin@yourdomain.com docker-compose -f docker-compose.prod.yml up -d
#
# Biến môi trường cần thiết:
# - DOMAIN: Domain cho HTTPS (vd: example.com)
# - ACME_EMAIL: Email nhận thông báo Let's Encrypt
# - POSTGRES_PASSWORD: Mật khẩu PostgreSQL (production)
# - JWT_SECRET: Secret cho JWT (nên dùng từ generate_env.sh)

services:
  # ===================
  # REVERSE PROXY - SSL
  # ===================
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@localhost}
    depends_on:
      - api
      - web
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===================
  # DATABASE
  # ===================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: email_service
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups # Thư mục backup
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Không expose port ra ngoài trong production

    # ===================
    # REDIS (Queue/Cache)
    # ===================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --aof-use-rdb-preamble yes
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    # ===================
    # API BACKEND
    # ===================
  api:
    build:
      context: ./services/api
    restart: unless-stopped
    env_file:
      - ./services/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/email_service
      HTTP_PORT: 3001
      SMTP_PORT: 2525
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Transactional outbound config is sourced from services/api/.env
      # Mail configuration
      MAIL_DOMAIN: ${DOMAIN:-localhost}
      MAIL_FROM_NAME: "Ephemera"
      MAIL_FROM_ADDRESS: "noreply@${DOMAIN:-localhost}"
      # TEMPORARY: Set to false until PTR record is configured
      # Change to true after setting up PTR record with DigitalOcean
      REQUIRE_EMAIL_VERIFICATION: "false"
      ALLOW_AUTO_DOMAIN_CREATION: "false" # Disabled in production
      WEB_URL: https://app.${DOMAIN:-localhost}
      STORAGE_DIR: /app/storage
      TRUST_PROXY: "true"
      # Postfix sync configuration
      RELAY_DOMAINS_PATH: /app/shared/relay_domains
      POSTFIX_CONTAINER: email-platform-postfix-1
    depends_on:
      - postgres
      - redis
      - postfix
    volumes:
      - api_storage:/app/storage
      - postfix_shared:/app/shared
      - ./backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.config/rclone:/root/.config/rclone:ro
    # SMTP ingress stays internal to Docker network (Postfix -> API),
    # avoid exposing API SMTP port directly to the public internet.
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===================
  # OUTBOUND SMTP (Postfix + OpenDKIM)
  # ===================
  postfix:
    build:
      context: ./services/postfix
    restart: unless-stopped
    hostname: mail.${DOMAIN:-localhost}
    environment:
      MAIL_DOMAIN: ${DOMAIN:-localhost}
      MAIL_HOSTNAME: mail.${DOMAIN:-localhost}
      DKIM_SELECTOR: mail
      RELAY_HOST: ${RELAY_HOST:-}
      RELAY_PORT: ${RELAY_PORT:-2525}
      RELAY_USER: ${RELAY_USER:-}
      RELAY_PASS: ${RELAY_PASS:-}
      EXTRA_DOMAINS: manhquy.online
    volumes:
      - postfix_dkim:/etc/opendkim/keys
      - postfix_shared:/app/shared
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Port 25 có thể expose nếu cần nhận mail từ ngoài
    ports:
      - "25:25"
      - "587:587"
    # ===================
    # IMAP SERVER (Dovecot)
    # ===================
  dovecot:
    build:
      context: ./services/dovecot
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - maildir_data:/var/mail
      - ./services/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./services/dovecot/dovecot-sql.conf.ext:/etc/dovecot/dovecot-sql.conf.ext:ro
      - ./services/dovecot/conf.d:/etc/dovecot/conf.d:ro
    ports:
      - "143:143" # IMAP
      - "993:993" # IMAPS
    depends_on:
      - postgres
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "doveadm", "service", "status" ]
      interval: 30s
      timeout: 10s
      retries: 3
    # ===================
    # WEB FRONTEND
    # ===================
  web:
    build:
      context: ./services/web
      args:
        VITE_API_BASE: https://api.${DOMAIN:-localhost}
        VITE_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
        VITE_MAIL_HOSTNAME: mail.${DOMAIN:-localhost}
        VITE_MAIL_SERVER_IP: ${MAIL_SERVER_IP:-165.22.48.193}
        VITE_CLARITY_PROJECT_ID: ${VITE_CLARITY_PROJECT_ID:-}
    restart: unless-stopped
    environment:
      # Runtime environment for entrypoint.sh to generate config.js
      VITE_API_BASE: https://api.${DOMAIN:-localhost}
      OUTBOUND_ENABLED: ${OUTBOUND_ENABLED:-false}
      VITE_MAIL_HOSTNAME: mail.${DOMAIN:-localhost}
      VITE_MAIL_SERVER_IP: ${MAIL_SERVER_IP:-165.22.48.193}
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Port 80 nội bộ, Caddy reverse proxy

    # ===================
    # MONITORING
    # ===================
  prometheus:
    image: prom/prometheus:v2.45.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=2GB"
      - "--storage.tsdb.wal-compression"
    volumes:
      - ./services/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./services/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.26.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$TELEGRAM_BOT_TOKEN" ] && [ "$$TELEGRAM_BOT_TOKEN" != "" ]; then
          cat > /etc/alertmanager/alertmanager.yml << EOF
        global:
          resolve_timeout: 5m
        route:
          group_by: ["alertname", "severity"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          receiver: "telegram"
        receivers:
          - name: "telegram"
            telegram_configs:
              - bot_token: "$$TELEGRAM_BOT_TOKEN"
                chat_id: $$TELEGRAM_ALERT_CHAT_ID
                parse_mode: "HTML"
        EOF
        else
          cat > /etc/alertmanager/alertmanager.yml << 'EOF'
        global:
          resolve_timeout: 5m
        route:
          group_by: ["alertname"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          receiver: "null"
        receivers:
          - name: "null"
        EOF
        fi
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALERT_CHAT_ID=${TELEGRAM_ALERT_CHAT_ID:-0}
    restart: unless-stopped
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/email_service?sslmode=disable"
    restart: unless-stopped
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    environment:
      REDIS_ADDR: "redis:6379"
    restart: unless-stopped
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:v1.7.0
    restart: unless-stopped
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.0.3
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN:-localhost}
    volumes:
      - ./services/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pushgateway:
    image: prom/pushgateway:latest
    container_name: email-platform-pushgateway-1
    restart: unless-stopped
    command:
      - --persistence.interval=5m
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    build:
      context: .
      dockerfile: services/backup/Dockerfile
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backups:/backups
    env_file:
      - ./services/api/.env
    environment:
      - BACKUP_DIR=/backups
      - CONTAINER_NAME=email-platform-postgres-1
    depends_on:
      - postgres
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===================
  # ANTI-ABUSE
  # ===================
  # ClamAV virus scanning
  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
        reservations:
          cpus: '0.50'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "clamdscan", "--version" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Rspamd spam filtering
  rspamd:
    image: rspamd/rspamd:latest
    restart: unless-stopped
    volumes:
      - rspamd_data:/var/lib/rspamd
      - ./services/rspamd/local.d:/etc/rspamd/local.d:ro
    networks:
      - email_network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD", "rspamadm", "control", "stat" ]
      interval: 30s
      timeout: 10s
      retries: 3
  # ===================
  # VOLUMES
  # ===================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_storage:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  postfix_dkim:
    driver: local
  postfix_shared:
    driver: local
  clamav_data:
    driver: local
  rspamd_data:
    driver: local
  maildir_data:
    driver: local
  # ===================
  # NETWORKS
  # ===================
networks:
  email_network:
    driver: bridge
