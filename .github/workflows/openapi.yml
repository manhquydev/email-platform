# OpenAPI Validation Workflow
# Validates OpenAPI spec and generates SDKs on changes

name: OpenAPI Validation

on:
  push:
    paths:
      - 'services/api/openapi/**'
      - 'services/api/src/openapi/**'
      - 'services/api/src/plugins/swagger.ts'
      - 'services/api/src/server.ts'
      - 'services/api/src/routes/**'
      - 'services/api/src/test/openapi-contract.test.ts'
      - 'services/api/scripts/generate-openapi.ts'
      - 'services/api/scripts/generate-route-map.ts'
      - 'services/api/openapi/route-map.json'
      - 'packages/sdk-*/**'
    branches: [main, develop]
  pull_request:
    paths:
      - 'services/api/openapi/**'
      - 'services/api/src/openapi/**'
      - 'services/api/src/plugins/swagger.ts'
      - 'services/api/src/server.ts'
      - 'services/api/src/routes/**'
      - 'services/api/src/test/openapi-contract.test.ts'
      - 'services/api/scripts/generate-openapi.ts'
      - 'services/api/scripts/generate-route-map.ts'
      - 'services/api/openapi/route-map.json'
      - 'packages/sdk-*/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: email_service_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/api/package-lock.json

      - name: Install dependencies
        run: |
          cd services/api
          npm ci

      - name: Generate OpenAPI spec
        run: |
          cd services/api
          npx ts-node scripts/generate-openapi.ts

      - name: Validate OpenAPI spec
        run: |
          npx @openapitools/openapi-generator-cli validate \
            -i services/api/openapi/openapi.yaml

      - name: Route map drift gate
        run: |
          cd services/api
          npx ts-node scripts/generate-route-map.ts --check

      - name: Run OpenAPI contract gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/email_service_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
        run: |
          cd services/api
          npx vitest run src/test/openapi-contract.test.ts

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: |
            services/api/openapi/openapi.yaml
            services/api/openapi/openapi.json
            services/api/openapi/route-map.json

  sdk-core:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build sdk-core
        run: |
          cd packages/sdk-core
          npm install
          npm run build

      - name: Run tests
        run: |
          cd packages/sdk-core
          npm test || true
