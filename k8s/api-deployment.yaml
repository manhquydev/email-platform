---
# API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempmail-api
  labels:
    app: tempmail
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tempmail
      component: api
  template:
    metadata:
      labels:
        app: tempmail
        component: api
    spec:
      containers:
        - name: api
          image: tempmail-api:latest
          ports:
            - containerPort: 3001
              name: http
            - containerPort: 2525
              name: smtp
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tempmail-secrets
                  key: database-url
            - name: DATABASE_READ_URL
              valueFrom:
                secretKeyRef:
                  name: tempmail-secrets
                  key: database-read-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tempmail-secrets
                  key: jwt-secret
            - name: REDIS_HOST
              value: redis-service
            - name: REDIS_PORT
              value: "6379"
            - name: STORAGE_DIR
              value: /app/storage
            - name: HTTP_PORT
              value: "3001"
            - name: SMTP_PORT
              value: "2525"
            - name: TRUST_PROXY
              value: "true"
            - name: WEB_URL
              valueFrom:
                configMapKeyRef:
                  name: tempmail-config
                  key: web-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: storage
              mountPath: /app/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: api-storage-pvc
---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: api-service
  labels:
    app: tempmail
    component: api
spec:
  selector:
    app: tempmail
    component: api
  ports:
    - name: http
      port: 3001
      targetPort: 3001
    - name: smtp
      port: 2525
      targetPort: 2525
  type: ClusterIP
