<?xml version="1.0" encoding="UTF-8"?>
<!-- Ephemera Logo - Full Version with Text -->
<!-- Clean, modern design inspired by Google/Microsoft simplicity -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <!-- Electric Blue Gradient -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <!-- Subtle fade effect for "ephemeral" concept -->
    <linearGradient id="fadeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A0A0B"/>
      <stop offset="70%" style="stop-color:#0A0A0B"/>
      <stop offset="100%" style="stop-color:#0A0A0B;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Mark: Stylized "E" envelope with disappearing effect -->
  <g id="logomark">
    <!-- Main envelope body -->
    <rect x="8" y="18" width="44" height="34" rx="4" fill="url(#blueGradient)"/>
    <!-- Envelope flap - creates "E" shape -->
    <path d="M8 22 L30 38 L52 22" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left bar of "E" -->
    <rect x="12" y="42" width="16" height="3" rx="1.5" fill="white" opacity="0.9"/>
    <!-- Middle bar of "E" -->
    <rect x="12" y="33" width="12" height="3" rx="1.5" fill="white" opacity="0.7"/>
    <!-- Dissolving particles (ephemeral effect) -->
    <circle cx="54" cy="24" r="2" fill="#3B82F6" opacity="0.6"/>
    <circle cx="58" cy="30" r="1.5" fill="#3B82F6" opacity="0.4"/>
    <circle cx="56" cy="38" r="1" fill="#3B82F6" opacity="0.2"/>
  </g>
  
  <!-- Wordmark: "Ephemera" -->
  <text x="72" y="48" font-family="'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#0A0A0B" letter-spacing="-0.5">
    <tspan>Ephemera</tspan>
  </text>
</svg>
