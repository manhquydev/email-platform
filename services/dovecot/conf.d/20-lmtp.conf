# LMTP service configuration
# Used to receive mail from Postfix or SMTP server

protocol lmtp {
  mail_plugins = 
  postmaster_address = postmaster@%{hostname}
}

service lmtp {
  # Listen on a Unix socket for local delivery from SMTP server
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
  
  # Also listen on a TCP port for container networking
  inet_listener lmtp {
    address = *
    port = 24
  }
}
