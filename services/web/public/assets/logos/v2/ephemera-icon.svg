<?xml version="1.0" encoding="UTF-8"?>
<!-- Ephemera Icon - Square format for app icons -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="icon-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="60%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background - Void Black -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#0A0A0B"/>
  
  <!-- Broken Infinity in white -->
  <g transform="translate(12, 18)">
    <!-- Left loop - complete -->
    <path d="
      M 20 14
      C 20 4, 4 4, 4 14
      C 4 24, 20 24, 20 14
    " fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Right loop - fading -->
    <path d="
      M 20 14
      C 20 4, 36 4, 36 14
    " fill="none" stroke="url(#icon-fade)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Dissolving particles -->
    <circle cx="36" cy="14" r="2" fill="white" opacity="0.45"/>
    <circle cx="38" cy="10" r="1.3" fill="white" opacity="0.3"/>
    <circle cx="39" cy="16" r="1" fill="white" opacity="0.2"/>
    <circle cx="37" cy="20" r="0.8" fill="white" opacity="0.15"/>
  </g>
</svg>
