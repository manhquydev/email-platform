---
# Web Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempmail-web
  labels:
    app: tempmail
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tempmail
      component: web
  template:
    metadata:
      labels:
        app: tempmail
        component: web
    spec:
      containers:
        - name: web
          image: tempmail-web:latest
          ports:
            - containerPort: 80
              name: http
          env:
            - name: VITE_API_BASE
              valueFrom:
                configMapKeyRef:
                  name: tempmail-config
                  key: api-url
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
# Web Service
apiVersion: v1
kind: Service
metadata:
  name: web-service
  labels:
    app: tempmail
    component: web
spec:
  selector:
    app: tempmail
    component: web
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
