[databases]
# Connection pooling for TempMail Pro database
# Host: postgres service
# Port: 5432
# Database name: tempmail_db
tempmail_db = host=postgres port=5432 dbname=tempmail_db

[pgbouncer]
# Connection settings
listen_port = 6432
listen_addr = 0.0.0.0

# Authentication
auth_type = md5
auth_file = /etc/pgbouncer/users.txt

# Pooler mode (session = transaction pooling is best for Prisma)
pool_mode = transaction

# Connection limits
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 50
max_user_connections = 50

# Timeouts
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = select 1
server_lifetime = 3600
server_idle_timeout = 600

# Logging
log_disconnections = 1
log_connections = 1
log_pooler_errors = 1
stats_period = 60

# Admin interface for monitoring
admin_users = postgres
stats_users = stats, postgres

# Performance tuning
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 5
tcp_keepintvl = 5

# Disable automatic server reset to improve performance
ignore_startup_parameters = extra_float_digits