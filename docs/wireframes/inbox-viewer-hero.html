<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox Viewer - Hero Wireframe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      theme: {
        extend: {
          colors: {
            'v3-bg-primary': '#000000',
            'v3-bg-elevated': '#09090b',
            'v3-bg-surface': '#18181b',
            'v3-bg-hover': '#27272a',
            'v3-border-default': '#27272a',
            'v3-border-strong': '#3f3f46',
            'v3-text-primary': '#ffffff',
            'v3-text-secondary': '#a1a1aa',
            'v3-text-muted': '#71717a',
          },
          borderRadius: {
            'v3-sm': '4px',
            'v3-md': '6px',
            'v3-lg': '8px',
          }
        }
      }
    }
  </script>
  <style>
    /* Vietnamese font support */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }

    /* Subtle focus ring - only allowed glow effect per spec */
    .input-focus:focus {
      outline: none;
      border-color: #3f3f46;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-v3-bg-primary text-v3-text-primary min-h-screen">

  <!-- Hero Section - Full Viewport -->
  <section class="min-h-screen flex flex-col items-center justify-center px-6">

    <!-- Content Container -->
    <div class="w-full max-w-xl text-center space-y-8">

      <!-- Headline -->
      <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-v3-text-primary leading-tight">
        Xem hộp thư công khai tức thì
      </h1>

      <!-- Subtext -->
      <p class="text-v3-text-secondary text-base md:text-lg">
        Nhập địa chỉ email để kiểm tra - không cần đăng nhập
      </p>

      <!-- Input + Button Group -->
      <form class="space-y-4">
        <div class="flex flex-col sm:flex-row gap-3">
          <!-- Email Input -->
          <input
            type="email"
            placeholder="nguoidung@example.com"
            class="input-focus flex-1 h-14 px-5 bg-v3-bg-surface border border-v3-border-default rounded-v3-lg text-v3-text-primary placeholder:text-v3-text-muted text-base transition-colors"
          />

          <!-- CTA Button -->
          <button
            type="submit"
            class="h-14 px-8 bg-white text-black font-medium rounded-v3-md hover:bg-zinc-200 transition-colors whitespace-nowrap"
          >
            Xem hộp thư
          </button>
        </div>

        <!-- Keyboard Hint -->
        <p class="text-v3-text-muted text-sm">
          Nhấn <kbd class="px-2 py-0.5 bg-v3-bg-surface border border-v3-border-default rounded-v3-sm font-mono text-xs">Enter</kbd> để tìm kiếm
        </p>
      </form>

      <!-- Trust Badges -->
      <div class="flex flex-wrap items-center justify-center gap-4 pt-4">
        <div class="flex items-center gap-2 text-v3-text-secondary text-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          <span>Không cần đăng ký</span>
        </div>

        <div class="w-px h-4 bg-v3-border-default hidden sm:block"></div>

        <div class="flex items-center gap-2 text-v3-text-secondary text-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          <span>Realtime</span>
        </div>

        <div class="w-px h-4 bg-v3-border-default hidden sm:block"></div>

        <div class="flex items-center gap-2 text-v3-text-secondary text-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>Công khai</span>
        </div>
      </div>

    </div>

  </section>

  <!-- Annotation Notes (Development Only) -->
  <div class="fixed bottom-4 right-4 p-4 bg-v3-bg-elevated border border-v3-border-default rounded-v3-lg max-w-xs text-xs text-v3-text-muted space-y-2">
    <p class="font-medium text-v3-text-secondary">Design Notes:</p>
    <ul class="space-y-1 list-disc list-inside">
      <li>Version C: Superhuman style</li>
      <li>Pure black bg (#000)</li>
      <li>No gradients/glow/blur</li>
      <li>Border radius max 8px</li>
      <li>Transitions 200ms</li>
    </ul>
  </div>

</body>
</html>
