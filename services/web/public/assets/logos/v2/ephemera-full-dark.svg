<?xml version="1.0" encoding="UTF-8"?>
<!-- Ephemera Logo - Full with Wordmark (Dark Mode) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="dark-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="dark-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="70%" style="stop-color:#93C5FD"/>
      <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Broken Infinity -->
  <g transform="translate(8, 12)">
    <path d="M 24 20 C 24 8, 6 8, 6 20 C 6 32, 24 32, 24 20" fill="none" stroke="url(#dark-gradient)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 24 20 C 24 8, 42 8, 42 20" fill="none" stroke="url(#dark-fade)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="42" cy="20" r="2" fill="#93C5FD" opacity="0.5"/>
    <circle cx="45" cy="16" r="1.5" fill="#93C5FD" opacity="0.35"/>
    <circle cx="46" cy="22" r="1.2" fill="#BFDBFE" opacity="0.25"/>
    <circle cx="44" cy="27" r="1" fill="#BFDBFE" opacity="0.2"/>
    <circle cx="48" cy="18" r="0.8" fill="#DBEAFE" opacity="0.15"/>
  </g>
  
  <!-- Wordmark - White for dark mode -->
  <text x="72" y="42" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="26" font-weight="700" fill="#FAFAFA" letter-spacing="-0.5">
    Ephemera
  </text>
</svg>
