<?xml version="1.0" encoding="UTF-8"?>
<!-- Ephemera Wordmark Only - Text logo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <!-- Fade effect for ephemeral concept -->
    <linearGradient id="textFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A0A0B"/>
      <stop offset="85%" style="stop-color:#0A0A0B"/>
      <stop offset="100%" style="stop-color:#0A0A0B;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
  
  <!-- Wordmark with fade effect -->
  <text x="8" y="34" font-family="'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="url(#textFade)" letter-spacing="-1">
    Ephemera
  </text>
</svg>
