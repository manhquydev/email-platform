[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ephemera"
version = "1.0.0"
description = "Official Python SDK for Ephemera temporary email platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Ephemera Team", email = "dev@ephemera.email" }
]
keywords = ["ephemera", "email", "temporary-email", "disposable-email", "testing", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://ephemera.email"
Documentation = "https://ephemera.email/docs/sdk/python"
Repository = "https://github.com/ephemera-email/sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["ephemera"]
