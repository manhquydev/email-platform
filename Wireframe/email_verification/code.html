<div class="absolute inset-0 bg-gradient-to-tr from-primary/5 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none"></div>
<!-- Icon Wrapper with Pulse Animation -->
<div class="relative mb-8">
<div class="absolute inset-0 bg-primary/30 rounded-full blur-xl animate-pulse"></div>
<div class="relative size-20 rounded-full bg-gradient-to-br from-[#1e1e40] to-[#0a0a18] border border-primary/30 flex items-center justify-center shadow-glow">
<span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings: 'FILL' 1, 'wght' 600;">
                        check_circle
                    </span>
</div>
</div>

<h2 class="text-3xl font-bold text-white mb-3 tracking-tight">Email Verified</h2>
<p class="text-slate-300 text-base leading-relaxed mb-8 max-w-[320px]">

            </p>

<div class="w-full flex flex-col gap-4">
<button class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-medium rounded-lg transition-all duration-300 shadow-glow hover:shadow-[0_0_30px_rgba(37,37,244,0.6)] hover:-translate-y-0.5 flex items-center justify-center gap-2 group/btn">

<span class="font-mono text-slate-400">8f92-a7b3-4c1d</span>
