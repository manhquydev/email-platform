<?xml version="1.0" encoding="UTF-8"?>
<!-- Ephemera Icon - Minimal single-color version -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Minimal icon - works at small sizes -->
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Envelope body -->
    <rect x="3" y="7" width="26" height="18" rx="2"/>
    <!-- Envelope flap -->
    <path d="M3 9 L16 18 L29 9"/>
    <!-- E middle bar -->
    <line x1="6" y1="17" x2="12" y2="17" opacity="0.7"/>
  </g>
  <!-- Dissolving dots -->
  <circle cx="29" cy="10" r="1" fill="currentColor" opacity="0.4"/>
  <circle cx="30" cy="15" r="0.7" fill="currentColor" opacity="0.25"/>
</svg>
