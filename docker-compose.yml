services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_service
    volumes:
      - email_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # ===================
  # REVERSE PROXY - SSL
  # ===================
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-manhquy.click}
      - ACME_EMAIL=${ACME_EMAIL:-manhquydev@gmail.com}
    depends_on:
      - api
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    build:
      context: .
      dockerfile: services/backup/Dockerfile
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backups:/backups
    env_file:
      - ./services/api/.env
    environment:
      - BACKUP_DIR=/backups
      - CONTAINER_NAME=email-platform-postgres-1
    depends_on:
      - postgres

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    env_file:
      - ./services/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/email_service
      HTTP_PORT: 3001
      SMTP_PORT: 2525
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Mailpit configuration for local development
      OUTBOUND_SMTP_HOST: mailpit
      OUTBOUND_SMTP_PORT: 1025
      OUTBOUND_SMTP_USER: ""
      OUTBOUND_SMTP_PASS: ""
      OUTBOUND_SMTP_SECURE: "false"
      OUTBOUND_ENABLED: "true"
      ALLOW_AUTO_DOMAIN_CREATION: "true"
      EPHEMERA_EDITION: "community"
      DEFAULT_ADMIN_EMAIL: "manhquydev@gmail.com"
      DEFAULT_ADMIN_PASSWORD: "Manhquy203@"
      # Use env var for WEB_URL or default to production domain
      WEB_URL: ${WEB_URL:-https://app.manhquy.click}
      STORAGE_DIR: /app/storage
    depends_on:
      - postgres
      - mailpit
      - redis
    volumes:
      - email_storage:/app/storage
    ports:
      - "3001:3001"
      - "25:2525"
    command: sh -c "node dist/index.js"

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  web:
    build:
      context: ./services/web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-https://api.manhquy.click}

  prometheus:
    image: prom/prometheus:v2.45.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./services/observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.3
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./services/observability/grafana/provisioning:/etc/grafana/provisioning
      - ./services/observability/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  email_postgres_data:
    driver: local
  email_storage:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
