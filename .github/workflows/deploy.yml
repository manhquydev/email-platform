name: Deploy to Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          SCAN_OK=0
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/tmp/ssh-keyscan.err; then
              SCAN_OK=1
              echo "ssh-keyscan succeeded on attempt $i"
              break
            fi
            echo "ssh-keyscan attempt $i failed"
            cat /tmp/ssh-keyscan.err || true
            sleep 3
          done

          if [ "$SCAN_OK" -ne 1 ]; then
            echo "ssh-keyscan failed after retries. Continue with StrictHostKeyChecking=no fallback."
          fi

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=20 -o ServerAliveCountMax=15 -o TCPKeepAlive=yes"
          timeout 120m ssh $SSH_OPTS $SERVER_USER@$SERVER_HOST "DEPLOY_PATH='$DEPLOY_PATH' bash -se" << 'ENDSSH'
            set -euo pipefail
            echo "Starting deployment..."

            # Resolve deployment directory with backward-compatible fallback
            if [ -n "${DEPLOY_PATH:-}" ] && [ -d "${DEPLOY_PATH}" ]; then
              TARGET_PATH="${DEPLOY_PATH}"
            elif [ -d "/root/email-platform" ]; then
              TARGET_PATH="/root/email-platform"
            elif [ -d "/root/email-platform." ]; then
              TARGET_PATH="/root/email-platform."
            else
              echo "Deploy path not found. Checked: DEPLOY_PATH, /root/email-platform, /root/email-platform."
              exit 1
            fi
            cd "${TARGET_PATH}"
            echo "Deploy path: ${TARGET_PATH}"

            # Pull latest code
            echo "Pulling latest code..."
            git fetch --prune origin main
            git reset --hard origin/main

            # Remove temporary check scripts left from hotfix/debug sessions
            echo "Cleaning tmp-check scripts..."
            find . -type f \( -name "tmp-check-*.js" -o -name "tmp-check-*.cjs" \) -print -delete || true

            # CRITICAL: Remove orphaned migration folders that cause Prisma P3015 errors
            echo "Cleaning orphaned migration folders..."
            rm -rf services/api/prisma/migrations/manual 2>/dev/null || true
            find services/api/prisma/migrations -type d -empty -delete 2>/dev/null || true

            # Rebuild and restart Docker containers (api, web, postfix, dovecot)
            echo "Rebuilding Docker containers..."
            export COMPOSE_PROGRESS=plain
            # Build sequentially for stability on constrained production hosts.
            export DOCKER_BUILDKIT=0
            docker compose -f docker-compose.prod.yml build --pull postfix dovecot
            docker compose -f docker-compose.prod.yml build --pull api
            for attempt in 1 2; do
              if docker compose -f docker-compose.prod.yml build --pull web; then
                break
              fi
              if [ "$attempt" -eq 2 ]; then
                echo "Web image build failed after retries."
                exit 1
              fi
              echo "Web image build failed on attempt $attempt, retrying in 15s..."
              sleep 15
            done
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # Ensure Caddy reloads latest Caddyfile changes (bind mount updates need container restart)
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate caddy

            # Run database migrations
            echo "Running database migrations..."
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy || echo "Migration warning: check logs"

            # Wait for services to be healthy
            echo "Waiting for services to start..."
            sleep 20

            # Trigger Postfix relay domains sync from API
            echo "Syncing Postfix relay domains..."
            docker compose -f docker-compose.prod.yml exec -T api node -e "
              const { PrismaClient } = require('@prisma/client');
              const fs = require('fs');
              const prisma = new PrismaClient();
              async function sync() {
                const domains = await prisma.domain.findMany({ where: { status: 'VERIFIED' }, select: { name: true } });
                if (domains.length === 0) { console.log('No verified domains to sync'); return; }
                const content = domains.map(d => d.name + ' OK').join('\n') + '\n';
                fs.mkdirSync('/app/shared', { recursive: true });
                fs.writeFileSync('/app/shared/relay_domains', content);
                console.log('Synced ' + domains.length + ' domains to Postfix');
                await prisma.\$disconnect();
              }
              sync();
            " || echo "Sync warning: will retry on next API restart"

            # Check container status
            echo "Container status:"
            docker compose -f docker-compose.prod.yml ps

            # Quick health check with retry
            echo "Health check..."
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:3001/health >/dev/null; then
                echo "API health check passed"
                break
              fi
              echo "Health check retry $i/5..."
              sleep 5
            done

            echo "Deployment completed successfully!"
          ENDSSH

      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=20 -o ServerAliveCountMax=15 -o TCPKeepAlive=yes"
          ssh $SSH_OPTS $SERVER_USER@$SERVER_HOST "if [ -n '${DEPLOY_PATH}' ] && [ -f '${DEPLOY_PATH}/docker-compose.prod.yml' ]; then docker compose -f '${DEPLOY_PATH}/docker-compose.prod.yml' ps; elif [ -f /root/email-platform/docker-compose.prod.yml ]; then docker compose -f /root/email-platform/docker-compose.prod.yml ps; else docker compose -f /root/email-platform./docker-compose.prod.yml ps; fi"
