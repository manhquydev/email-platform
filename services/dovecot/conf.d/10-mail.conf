# Mail location and namespace configuration

mail_location = maildir:/var/mail/%d/%n

# Primary namespace
namespace inbox {
  inbox = yes
  location = 
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Spam {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Archive {
    auto = no
    special_use = \Archive
  }
  prefix = 
  separator = /
}

# Mail process settings
mail_uid = vmail
mail_gid = vmail
mail_privileged_group = vmail

# Permissions
mail_access_groups = 

# First valid UID/GID values for mail users
first_valid_uid = 1000
first_valid_gid = 1000
