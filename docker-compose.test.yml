services:
  postgres_test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_service_test
    ports:
      - "5433:5432" # Use a different port to avoid conflict with dev DB
    tmpfs:
      - /var/lib/postgresql/data # Use tmpfs for faster tests and auto-cleanup

  redis_test:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
