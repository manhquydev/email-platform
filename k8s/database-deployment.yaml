---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: tempmail
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempmail
      component: redis
  template:
    metadata:
      labels:
        app: tempmail
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine # pin to @sha256:<digest> before production deploy
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels:
    app: tempmail
    component: redis
spec:
  selector:
    app: tempmail
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
---
# PostgreSQL StatefulSet (for development/single-node)
# For production, use managed PostgreSQL (RDS, Cloud SQL, etc.)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: tempmail
    component: postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: tempmail
      component: postgres
  template:
    metadata:
      labels:
        app: tempmail
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.4-alpine # pin to @sha256:<digest> before production deploy
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: email_service
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tempmail-secrets
                  key: postgres-password
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  labels:
    app: tempmail
    component: postgres
spec:
  selector:
    app: tempmail
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
