<?xml version="1.0" encoding="UTF-8"?>
<!-- Ephemera Logo 512x512 for JSON-LD -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="fade-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="70%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="#0A0A0B"/>

  <!-- Broken Infinity Logo -->
  <g transform="translate(96, 156)" filter="url(#glow)">
    <!-- Left loop -->
    <path d="
      M 160 100
      C 160 30, 40 30, 40 100
      C 40 170, 160 170, 160 100
    " fill="none" stroke="url(#logo-grad)" stroke-width="28" stroke-linecap="round"/>

    <!-- Right loop - fading -->
    <path d="
      M 160 100
      C 160 30, 280 30, 280 100
    " fill="none" stroke="url(#fade-grad)" stroke-width="28" stroke-linecap="round"/>

    <!-- Dissolving particles -->
    <circle cx="290" cy="100" r="12" fill="#60A5FA" opacity="0.6"/>
    <circle cx="305" cy="70" r="9" fill="#60A5FA" opacity="0.4"/>
    <circle cx="315" cy="115" r="7" fill="#93C5FD" opacity="0.3"/>
    <circle cx="300" cy="140" r="6" fill="#93C5FD" opacity="0.25"/>
    <circle cx="325" cy="85" r="5" fill="#BFDBFE" opacity="0.2"/>
  </g>
</svg>
