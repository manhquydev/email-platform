apiVersion: v2
name: tempmail-pro
description: TempMail Pro - Multi-domain temporary email platform
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - email
  - temporary-email
  - temp-mail
  - mail
  - smtp
home: https://tempmail.pro
sources:
  - https://github.com/manhquydev/tempmail-pro
maintainers:
  - name: TempMail Pro Team
    email: team@tempmail.pro
dependencies:
  - name: postgresql
    version: 12.1.9
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 17.3.7
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: ingress-nginx
    version: 4.7.0
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled
  - name: cert-manager
    version: 1.11.0
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
  - name: prometheus
    version: 23.1.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: grafana
    version: 6.58.9
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
annotations:
  category: Infrastructure
  licenses: MIT
kubeVersion: ">=1.24.0-0"
icon: https://tempmail.pro/icon.png