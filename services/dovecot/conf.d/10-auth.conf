# Authentication configuration
# Use SQL for password and user lookup

passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

# Allow plaintext auth when using TLS
auth_verbose = yes
auth_debug = no

# Service configuration for auth
service auth {
  unix_listener auth-userdb {
    mode = 0660
  }
}
