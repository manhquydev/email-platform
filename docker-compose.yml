services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_service
    volumes:
      - email_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d email_service"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===================
  # REVERSE PROXY - SSL
  # ===================
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-manhquy.id.vn}
      - ACME_EMAIL=${ACME_EMAIL:-manhquydev@gmail.com}
    depends_on:
      - api
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    build:
      context: .
      dockerfile: services/backup/Dockerfile
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backups:/backups
    env_file:
      - ./services/api/.env
    environment:
      - BACKUP_DIR=/backups
      - CONTAINER_NAME=email-platform-postgres-1
    depends_on:
      - postgres

  api:
    build:
      context: ./services/api
    restart: unless-stopped
    env_file:
      - ./services/api/.env
    environment:
      # DATABASE_URL inherited from .env
      HTTP_PORT: 3001
      SMTP_PORT: 2525
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Mailpit configuration for local development
      OUTBOUND_SMTP_HOST: mailpit
      OUTBOUND_SMTP_PORT: 1025
      OUTBOUND_SMTP_USER: ""
      OUTBOUND_SMTP_PASS: ""
      OUTBOUND_SMTP_SECURE: "false"
      OUTBOUND_ENABLED: "true"
      ALLOW_AUTO_DOMAIN_CREATION: "true"
      EPHEMERA_EDITION: "community"
      DEFAULT_ADMIN_EMAIL: "manhquydev@gmail.com"
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-changeme}
      # Use env var for WEB_URL or default to production domain
      WEB_URL: ${WEB_URL:-https://app.manhquy.id.vn}
      STORAGE_DIR: /app/storage
      BACKUP_DIR: /app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - email_storage:/app/storage
      - ./backups:/app/backups
      - /root/.config/rclone:/root/.config/rclone:ro
    ports:
      - "3001:3001"
      - "25:2525"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
    command: sh -c "node dist/index.js"

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  web:
    build:
      context: ./services/web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-https://api.manhquy.id.vn}

  pushgateway:
    image: prom/pushgateway:latest
    container_name: email-platform-pushgateway-1
    restart: unless-stopped
    ports:
      - "9091:9091"
    command:
      - --persistence.interval=5m

  prometheus:
    image: prom/prometheus:v2.45.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./services/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./services/observability/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - pushgateway

  alertmanager:
    image: prom/alertmanager:v0.26.0
    volumes:
      - ./services/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALERT_CHAT_ID=${TELEGRAM_ALERT_CHAT_ID:-0}
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/email_service?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      - redis
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.7.0
    ports:
      - "9100:9100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.3
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
    volumes:
      - ./services/observability/grafana/provisioning:/etc/grafana/provisioning
      - ./services/observability/grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --aof-use-rdb-preamble yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  email_postgres_data:
    driver: local
  email_storage:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  prometheus_data:
    driver: local
