<?xml version="1.0" encoding="UTF-8"?>
<!-- CONCEPT 2: "Privacy Portal" - Cổng vào/ra thể hiện email đi vào và biến mất -->
<!-- Thể hiện: sự bảo mật tuyệt đối, email đi vào "portal" rồi biến mất -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="c2-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="c2-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <radialGradient id="c2-void" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0A0A0B"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </radialGradient>
  </defs>
  
  <!-- Outer ring - Portal frame -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#c2-outer)" stroke-width="8"/>
  
  <!-- Inner ring with gap - "breaking" effect -->
  <path d="
    M 60 25
    A 35 35 0 1 1 35 82
  " fill="none" stroke="url(#c2-inner)" stroke-width="5" stroke-linecap="round"/>
  
  <!-- The void center - where things disappear -->
  <circle cx="60" cy="60" r="24" fill="url(#c2-void)"/>
  
  <!-- "E" hint inside the void using dots/particles -->
  <!-- Top bar -->
  <rect x="48" y="48" width="3" height="3" fill="#60A5FA" opacity="0.6" rx="0.5"/>
  <rect x="53" y="48" width="3" height="3" fill="#60A5FA" opacity="0.5" rx="0.5"/>
  <rect x="58" y="48" width="2" height="2" fill="#93C5FD" opacity="0.4" rx="0.5"/>
  <rect x="62" y="48" width="2" height="2" fill="#BFDBFE" opacity="0.3" rx="0.5"/>
  
  <!-- Left bar (vertical) -->
  <rect x="48" y="53" width="3" height="4" fill="#60A5FA" opacity="0.5" rx="0.5"/>
  <rect x="48" y="59" width="3" height="3" fill="#60A5FA" opacity="0.4" rx="0.5"/>
  <rect x="48" y="64" width="3" height="4" fill="#60A5FA" opacity="0.35" rx="0.5"/>
  
  <!-- Middle bar -->
  <rect x="48" y="59" width="3" height="2" fill="#60A5FA" opacity="0.45" rx="0.5"/>
  <rect x="53" y="59" width="2" height="2" fill="#93C5FD" opacity="0.35" rx="0.5"/>
  <rect x="57" y="59" width="2" height="2" fill="#BFDBFE" opacity="0.25" rx="0.5"/>
  
  <!-- Bottom bar -->
  <rect x="48" y="68" width="3" height="3" fill="#60A5FA" opacity="0.4" rx="0.5"/>
  <rect x="53" y="68" width="3" height="3" fill="#60A5FA" opacity="0.3" rx="0.5"/>
  <rect x="58" y="68" width="2" height="2" fill="#93C5FD" opacity="0.2" rx="0.5"/>
  <rect x="62" y="68" width="2" height="2" fill="#BFDBFE" opacity="0.15" rx="0.5"/>
  
  <!-- Floating particles being "sucked in" -->
  <circle cx="90" cy="45" r="3" fill="#3B82F6" opacity="0.4"/>
  <circle cx="85" cy="55" r="2" fill="#60A5FA" opacity="0.35"/>
  <circle cx="88" cy="70" r="2.5" fill="#3B82F6" opacity="0.3"/>
  <circle cx="30" cy="75" r="2" fill="#60A5FA" opacity="0.25"/>
  <circle cx="35" cy="40" r="1.5" fill="#93C5FD" opacity="0.2"/>
</svg>
